services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinicdesk
    ports:
      # 5432 is the port .env.local and .env.test expect.
      # 5433 is a fallback: on this machine a natively-installed PostgreSQL 17
      # Windows service ("postgresql-x64-17") already owns host port 5432, so
      # connections to localhost:5432 silently reach THAT server instead of this
      # container and fail with 28P01 "password authentication failed".
      # Publishing both means the project works either way.
      - '5432:5432'
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE, the first time the volume is empty: creates the second
      # database the test suite uses, so `pnpm test` never touches dev data.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinic -d clinicdesk']
      interval: 5s
      timeout: 3s
      retries: 10

  # Only needed if you run the background jobs on BullMQ instead of node-cron.
  # Start it with:  docker compose --profile queue up -d
  # The job handlers are shared: node-cron runs them by default, BullMQ runs
  # the same ones when REDIS_URL is set. See src/server/jobs/handlers.ts.
  redis:
    image: redis:7-alpine
    profiles: ['queue']
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
